<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزرعة العنب والأفوكادو</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f6f8; text-align: center; padding: 20px; color: #333; }
        .card { background: white; padding: 15px; border-radius: 12px; margin: 10px auto; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #2e7d32; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-size: 15px; cursor: pointer; margin: 5px; }
        button:active { background: #1b5e20; }
        .log { font-weight: bold; color: #d32f2f; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>🍇 مزرعة العنب والأفوكادو 🥑</h1>
    <div class="card">
        <h3>📅 اليوم: <span id="day-val">1</span></h3>
        <p>💧 رطوبة العنب: <span id="grape-water">50</span>%</p>
        <button id="btn-water-grape">💧 ري العنب (+30)</button>
        <hr>
        <p>💧 رطوبة الأفوكادو: <span id="avocado-water">50</span>%</p>
        <button id="btn-water-avocado">💧 ري الأفوكادو (+30)</button>
    </div>
    <div class="card">
        <button id="btn-next-day" style="background: #1976d2;">⏭️ اليوم التالي</button>
        <button id="btn-harvest" style="background: #e65100;">✂️ قطاف أوراق العنب</button>
        <p id="message-log" class="log"></p>
    </div>
    <script src="main.dart.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("service-worker.js");}</script></body>
</html>
